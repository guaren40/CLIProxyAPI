name: Sync upstream into ARM64 fork

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'guaren40/CLIProxyAPI'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream source
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'Upstream is already merged.'
            echo 'updated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(git rev-parse HEAD)"
          # A deletion or rename in the protected deployment paths can still
          # report a merge conflict; resolve those paths from this fork below.
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            merge --no-commit --no-ff -X ours "$upstream_sha" || true
          test -f "$(git rev-parse --git-path MERGE_HEAD)"

          while IFS= read -r -d '' conflict; do
            case "$conflict" in
              Dockerfile|.dockerignore|docker-compose.yml|docker-compose.cluster.yml|.github/workflows/*|deploy/zeabur-entrypoint.sh|zeabur-template.yaml|README_ZEABUR_CN.md)
                if git cat-file -e "$previous:$conflict" 2>/dev/null; then
                  git checkout -f "$previous" -- "$conflict"
                else
                  git rm -f -- "$conflict"
                fi
                ;;
              *) echo "Unresolved upstream conflict: $conflict" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only --diff-filter=U -z)

          # Preserve the fork's deployment contract and workflows. Upstream code
          # outside these paths is merged normally.
          git restore --source="$previous" --staged --worktree -- \
            Dockerfile .dockerignore docker-compose.yml docker-compose.cluster.yml .github/workflows \
            deploy/zeabur-entrypoint.sh zeabur-template.yaml README_ZEABUR_CN.md
          if [ -n "$(git ls-files -u)" ]; then
            echo 'Upstream has conflicts outside the protected deployment paths.' >&2
            exit 1
          fi
          git diff --cached --check
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo 'updated=true' >> "$GITHUB_OUTPUT"

      - name: Build and verify the ARM64 image before updating main
        if: steps.merge.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 --tag cliproxyapi-arm64:sync .
          test "$(docker image inspect cliproxyapi-arm64:sync --format '{{.Architecture}}')" = arm64
          test "$(docker run --rm --platform linux/arm64 --entrypoint /bin/uname cliproxyapi-arm64:sync -m)" = aarch64

      - name: Smoke test first-run service
        if: steps.merge.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cliproxyapi-smoke --platform linux/arm64 \
            -p 127.0.0.1::8317 \
            -e CLI_PROXY_API_KEY=ci_api_key \
            -e CLI_PROXY_MANAGEMENT_KEY=ci_management_key \
            cliproxyapi-arm64:sync
          trap 'docker rm -f cliproxyapi-smoke >/dev/null 2>&1 || true' EXIT
          port="$(docker port cliproxyapi-smoke 8317/tcp | awk -F: '{print $NF}')"
          ready=false
          for _ in {1..30}; do
            if curl -fsS --max-time 2 "http://127.0.0.1:$port/healthz" | grep -q '"status":"ok"'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec cliproxyapi-smoke /bin/sh -c 'test -s /data/config.yaml && test -s /data/initial-credentials.txt'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/v1/models")" = 401

      - name: Push verified upstream merge
        if: steps.merge.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: sync upstream ${UPSTREAM_SHA:0:12}"
          git push origin HEAD:main
        env:
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
